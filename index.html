<!-- Script / Logic -->
    <script>
        // --- TRANSLATION DATA ---
        const i18nData = {
            id: {
                subtitle: "Beli ruang pixel untuk iklan Anda secara permanen.",
                status_board: "Status Papan",
                sold: "Terjual:",
                available: "Tersedia:",
                price_per_block: "Harga per Blok:",
                note_block: "* 1 blok = 20x20 pixels.",
                instruction: "Instruksi:",
                inst_1: "Geser kursor di area papan/canvas.",
                inst_2_bold: "Klik & seret (drag)",
                inst_2: "untuk memilih area.",
                inst_3: "Pastikan area bebas (tidak menabrak iklan lain).",
                inst_4: "Checkout pembayaran lalu pasang gambar Anda.",
                your_selection: "Area Pilihan Anda",
                size: "Ukuran:",
                total_price: "Total Harga:",
                proceed_payment: "Lanjut ke Pembayaran",
                ad_details: "Detail Iklan Anda",
                upload_img: "Unggah Gambar Iklan",
                ad_text: "Teks/Judul Iklan (Muncul saat kursor diarahkan)",
                ad_text_ph: "Cth: Sewa Mobil Jakarta",
                ad_link: "Tautan Web URL (Opsional)",
                ad_link_ph: "https://www.websiteanda.com",
                btn_cancel: "Batal",
                btn_publish: "Pasang Iklan",
                secure_checkout: "Checkout Aman",
                total_due: "Total Tagihan",
                sim_note: "Selesaikan pembayaran melalui PayPal di bawah. Setelah berhasil, Anda otomatis diarahkan untuk mengisi konten iklan.",
                msg_collision: "Area bertabrakan dengan iklan lain!",
                msg_empty: "Pilih area kosong terlebih dahulu.",
                msg_pay_success: "Pembayaran Berhasil! Silakan unggah gambar Anda.",
                msg_upload_req: "Harap unggah gambar atau masukkan teks iklan.",
                msg_pub_success: "Iklan berhasil dipublikasikan!",
                blocks: "blok",
                tooltip_link: "Klik untuk mengunjungi link",
                msg_cancel: "Pembayaran dibatalkan oleh pengguna.",
                msg_err: "PayPal Error. Cek console atau akun Anda."
            },
            en: {
                subtitle: "Buy pixel space for your ad permanently.",
                status_board: "Board Status",
                sold: "Sold:",
                available: "Available:",
                price_per_block: "Price per Block:",
                note_block: "* 1 block = 20x20 pixels.",
                instruction: "Instructions:",
                inst_1: "Hover over the canvas area.",
                inst_2_bold: "Click & drag",
                inst_2: "to select your area.",
                inst_3: "Ensure it doesn't overlap existing ads.",
                inst_4: "Checkout and upload your image.",
                your_selection: "Your Selection",
                size: "Size:",
                total_price: "Total Price:",
                proceed_payment: "Proceed to Payment",
                ad_details: "Ad Details",
                upload_img: "Upload Ad Image",
                ad_text: "Ad Text/Title (Hover text)",
                ad_text_ph: "Ex: Buy my awesome product",
                ad_link: "Web URL Link (Optional)",
                ad_link_ph: "https://www.yourwebsite.com",
                btn_cancel: "Cancel",
                btn_publish: "Publish Ad",
                secure_checkout: "Secure Checkout",
                total_due: "Total Due",
                sim_note: "Complete your payment via PayPal below. Once successful, you will automatically proceed to upload your ad.",
                msg_collision: "Area overlaps with another ad!",
                msg_empty: "Please select an empty area first.",
                msg_pay_success: "Payment Successful! Please upload your image.",
                msg_upload_req: "Please upload an image or enter text.",
                msg_pub_success: "Ad successfully published!",
                blocks: "blocks",
                tooltip_link: "Click to visit link",
                msg_cancel: "Payment was cancelled by the user.",
                msg_err: "PayPal Error. Check console or your account."
            }
        };

        let currentLang = 'id';
        const t = (key) => i18nData[currentLang][key];

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[currentLang][key]) el.innerText = i18nData[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (i18nData[currentLang][key]) el.placeholder = i18nData[currentLang][key];
            });
            
            const switchBg = document.getElementById('switch-bg');
            const switchKnob = document.getElementById('switch-knob');
            const lblId = document.getElementById('lbl-id');
            const lblEn = document.getElementById('lbl-en');
            
            if (switchBg) {
                if (currentLang === 'en') {
                    switchBg.classList.replace('bg-gray-300', 'bg-blue-600');
                    switchKnob.classList.replace('translate-x-0', 'translate-x-5');
                    lblEn.classList.replace('text-gray-400', 'text-gray-800');
                    lblId.classList.replace('text-gray-800', 'text-gray-400');
                } else {
                    switchBg.classList.replace('bg-blue-600', 'bg-gray-300');
                    switchKnob.classList.replace('translate-x-5', 'translate-x-0');
                    lblId.classList.replace('text-gray-400', 'text-gray-800');
                    lblEn.classList.replace('text-gray-800', 'text-gray-400');
                }
            }
            calculateStats();
            updateSelectionUI();
        }

        document.getElementById('lang-toggle-container').addEventListener('click', () => {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            applyLanguage();
        });

        // --- CORE GRID CONFIG ---
        const GRID_COLS = 200; 
        const GRID_ROWS = 100;
        const BLOCK_PX = 20; // 20px
        const CANVAS_WIDTH = GRID_COLS * BLOCK_PX; 
        const CANVAS_HEIGHT = GRID_ROWS * BLOCK_PX; 
        const PRICE_PER_BLOCK = 0.99; 

        // Variables for Global State
        let ads = [];
        let isDragging = false;
        let currentSelection = null;
        let hoverGridPos = { x: -1, y: -1 };
        let cachedImages = {}; 
        
        let currentTotalPrice = 0.00;
        let currentTotalBlocks = 0;

        // Elements
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const selectionPanel = document.getElementById('selection-panel');
        const selSizeText = document.getElementById('sel-size');
        const selPriceText = document.getElementById('sel-price');
        const btnInitPayment = document.getElementById('btn-init-payment');
        const statsSold = document.getElementById('stats-sold');
        const statsAvail = document.getElementById('stats-available');
        const tooltip = document.getElementById('tooltip');
        const tooltipText = document.getElementById('tooltip-text');
        const tooltipLink = document.getElementById('tooltip-link');
        const paymentAmountText = document.getElementById('payment-amount');

        const formatCurrency = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);

        function init() {
            applyLanguage();
            calculateStats(); 
            drawCanvas();
            setupCanvasEvents(); 
            setupUIEvents();
            initPayPalButton();
        }

        // --- PAYPAL INTEGRATION (Smart Buttons) ---
        function initPayPalButton() {
            if (window.paypal) {
                paypal.Buttons({
                    style: {
                        shape: 'rect',
                        color: 'gold',
                        layout: 'vertical',
                        label: 'checkout',
                    },
                    createOrder: function(data, actions) {
                        // Pastikan harga formatnya valid sebelum dilempar ke PayPal
                        const finalPrice = currentTotalPrice.toFixed(2);
                        
                        return actions.order.create({
                            purchase_units: [{
                                description: `Pixel Ads Space - ${currentTotalBlocks} blocks`,
                                amount: {
                                    currency_code: "USD", // Mewajibkan deklarasi kurs
                                    value: finalPrice
                                }
                            }]
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            closeModal('modal-payment');
                            showToast(t('msg_pay_success'), "success");
                            
                            // Reset form
                            document.getElementById('ad-image').value = '';
                            document.getElementById('ad-text').value = '';
                            document.getElementById('ad-link').value = '';
                            
                            setTimeout(() => openModal('modal-content'), 500);
                        });
                    },
                    onCancel: function(data) {
                        // Menangani jika user menekan tombol [X] atau keluar dari popup PayPal
                        showToast(t('msg_cancel'), "info");
                    },
                    onError: function(err) {
                        // Log detail error ke browser developer tools (F12 > Console)
                        console.error('Detail Error PayPal:', err);
                        showToast(t('msg_err'), "error");
                    }
                }).render('#paypal-button-container');
            } else {
                console.error("PayPal SDK not loaded.");
            }
        }

        function calculateStats() {
            let soldBlocks = 0;
            ads.forEach(ad => { soldBlocks += (ad.w * ad.h); });
            const totalBlocks = GRID_COLS * GRID_ROWS; 
            const availBlocks = totalBlocks - soldBlocks;
            const numFmt = currentLang === 'id' ? 'id-ID' : 'en-US';

            statsSold.innerText = `${soldBlocks.toLocaleString(numFmt)} ${t('blocks')}`;
            statsAvail.innerText = `${availBlocks.toLocaleString(numFmt)} ${t('blocks')}`;
        }

        function drawCanvas() {
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.strokeStyle = "#e5e7eb";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i <= CANVAS_WIDTH; i += BLOCK_PX) {
                ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_HEIGHT);
            }
            for (let i = 0; i <= CANVAS_HEIGHT; i += BLOCK_PX) {
                ctx.moveTo(0, i); ctx.lineTo(CANVAS_WIDTH, i);
            }
            ctx.stroke();

            ads.forEach(ad => {
                const pxX = ad.x * BLOCK_PX, pxY = ad.y * BLOCK_PX;
                const pxW = ad.w * BLOCK_PX, pxH = ad.h * BLOCK_PX;

                if (ad.imageUrl && cachedImages[ad.imageUrl]) {
                    ctx.drawImage(cachedImages[ad.imageUrl], pxX, pxY, pxW, pxH);
                } else {
                    ctx.fillStyle = ad.color || '#3b82f6';
                    ctx.fillRect(pxX, pxY, pxW, pxH);
                    if (pxW >= 40 && pxH >= 20 && ad.text) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 14px Inter, sans-serif";
                        ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.fillText(ad.text.substring(0, Math.floor(pxW / 8)), pxX + pxW / 2, pxY + pxH / 2);
                    }
                }
                ctx.strokeStyle = "rgba(0,0,0,0.15)";
                ctx.strokeRect(pxX, pxY, pxW, pxH);
            });

            if (currentSelection) {
                const rect = getSelectionRect(currentSelection.startX, currentSelection.startY, currentSelection.endX, currentSelection.endY);
                const pxX = rect.x * BLOCK_PX, pxY = rect.y * BLOCK_PX;
                const pxW = rect.w * BLOCK_PX, pxH = rect.h * BLOCK_PX;

                const isValid = isAreaFree(rect.x, rect.y, rect.w, rect.h);
                ctx.fillStyle = isValid ? "rgba(59, 130, 246, 0.45)" : "rgba(239, 68, 68, 0.45)";
                ctx.fillRect(pxX, pxY, pxW, pxH);
                ctx.strokeStyle = isValid ? "#2563eb" : "#dc2626";
                ctx.lineWidth = 2;
                ctx.strokeRect(pxX, pxY, pxW, pxH);
            }
        }

        function getGridCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let x = Math.max(0, Math.min((clientX - rect.left) * scaleX, CANVAS_WIDTH - 0.1));
            let y = Math.max(0, Math.min((clientY - rect.top) * scaleY, CANVAS_HEIGHT - 0.1));
            return { x: Math.floor(x / BLOCK_PX), y: Math.floor(y / BLOCK_PX) };
        }

        function getSelectionRect(startX, startY, endX, endY) {
            const minX = Math.min(startX, endX), minY = Math.min(startY, endY);
            return { x: minX, y: minY, w: Math.max(startX, endX) - minX + 1, h: Math.max(startY, endY) - minY + 1 };
        }

        function isAreaFree(x, y, w, h) {
            return !ads.some(ad => (x < ad.x + ad.w && x + w > ad.x && y < ad.y + ad.h && y + h > ad.y));
        }

        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', (e) => {
                if(e.button !== 0) return;
                const coords = getGridCoords(e.clientX, e.clientY);
                isDragging = true;
                currentSelection = { startX: coords.x, startY: coords.y, endX: coords.x, endY: coords.y };
                drawCanvas();
            });

            window.addEventListener('mousemove', (e) => {
                if (e.target === canvas && !isDragging) {
                    const coords = getGridCoords(e.clientX, e.clientY);
                    if(coords.x !== hoverGridPos.x || coords.y !== hoverGridPos.y) {
                        hoverGridPos = coords;
                        const hoveredAd = ads.find(ad => coords.x >= ad.x && coords.x < ad.x + ad.w && coords.y >= ad.y && coords.y < ad.y + ad.h);
                        if (hoveredAd && (hoveredAd.text || hoveredAd.link)) {
                            tooltip.style.opacity = '1';
                            tooltip.style.left = (e.pageX + 15) + 'px'; tooltip.style.top = (e.pageY + 15) + 'px';
                            tooltipText.innerText = hoveredAd.text || "Pixel Ad";
                            tooltipLink.innerText = hoveredAd.link ? t('tooltip_link') : "";
                            canvas.style.cursor = "pointer";
                        } else {
                            tooltip.style.opacity = '0'; canvas.style.cursor = "crosshair";
                        }
                    } else if (tooltip.style.opacity === '1') {
                        tooltip.style.left = (e.pageX + 15) + 'px'; tooltip.style.top = (e.pageY + 15) + 'px';
                    }
                } else { tooltip.style.opacity = '0'; }

                if (isDragging) {
                    const coords = getGridCoords(e.clientX, e.clientY);
                    currentSelection.endX = coords.x; currentSelection.endY = coords.y;
                    drawCanvas(); updateSelectionUI();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    const rect = getSelectionRect(currentSelection.startX, currentSelection.startY, currentSelection.endX, currentSelection.endY);
                    if (!isAreaFree(rect.x, rect.y, rect.w, rect.h)) {
                        showToast(t('msg_collision'), "error");
                        if (btnInitPayment) btnInitPayment.disabled = true;
                    } else {
                        if (btnInitPayment) btnInitPayment.disabled = false;
                    }
                    updateSelectionUI();
                }
            });
            
            canvas.addEventListener('click', (e) => {
                if (currentSelection && (currentSelection.startX !== currentSelection.endX || currentSelection.startY !== currentSelection.endY)) return;
                const coords = getGridCoords(e.clientX, e.clientY);
                const clickedAd = ads.find(ad => coords.x >= ad.x && coords.x < ad.x + ad.w && coords.y >= ad.y && coords.y < ad.y + ad.h);
                if (clickedAd && clickedAd.link) {
                    let url = clickedAd.link;
                    if(!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    window.open(url, '_blank');
                }
            });
        }

        function updateSelectionUI() {
            if (!currentSelection) {
                selectionPanel.classList.add('opacity-50');
                if (btnInitPayment) btnInitPayment.disabled = true;
                selSizeText.innerText = `0 x 0 ${t('blocks')}`;
                selPriceText.innerText = formatCurrency(0);
                return;
            }
            selectionPanel.classList.remove('opacity-50');
            const rect = getSelectionRect(currentSelection.startX, currentSelection.startY, currentSelection.endX, currentSelection.endY);
            
            const blocks = rect.w * rect.h;
            currentTotalBlocks = blocks;
            currentTotalPrice = blocks * PRICE_PER_BLOCK;
            
            const numFmt = currentLang === 'id' ? 'id-ID' : 'en-US';

            selSizeText.innerText = `${rect.w} x ${rect.h} ${t('blocks')} (${(blocks * BLOCK_PX * BLOCK_PX).toLocaleString(numFmt)} px)`;
            selPriceText.innerText = formatCurrency(currentTotalPrice);
            paymentAmountText.innerText = formatCurrency(currentTotalPrice);
        }

        function setupUIEvents() {
            document.getElementById('btn-init-payment').addEventListener('click', () => {
                if (!currentSelection) return;
                const rect = getSelectionRect(currentSelection.startX, currentSelection.startY, currentSelection.endX, currentSelection.endY);
                if (!isAreaFree(rect.x, rect.y, rect.w, rect.h)) {
                     showToast(t('msg_empty'), "error"); return;
                }
                paymentAmountText.innerText = formatCurrency(currentTotalPrice);
                openModal('modal-payment');
            });

            document.getElementById('btn-publish-ad').addEventListener('click', publishAd);
        }

        window.openModal = (id) => {
            const modal = document.getElementById(id);
            const inner = modal.querySelector('div');
            modal.classList.remove('hidden'); void modal.offsetWidth;
            modal.classList.remove('opacity-0'); inner.classList.remove('scale-95');
        };

        window.closeModal = (id) => {
            const modal = document.getElementById(id);
            const inner = modal.querySelector('div');
            modal.classList.add('opacity-0'); inner.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        function showToast(message, type="info") {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = message;
            
            const baseClass = "fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 transition-all duration-300";
            if (type === "error") {
                toast.className = baseClass + " bg-red-600";
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
            } else if(type === "success") {
                toast.className = baseClass + " bg-green-600";
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
            } else {
                 toast.className = baseClass + " bg-gray-900"; icon.innerHTML = '';
            }
            requestAnimationFrame(() => { toast.classList.remove('translate-y-[-150%]', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-[-150%]', 'opacity-0'); }, 3000);
        }

        async function publishAd() {
            if(!currentSelection) return;
            const text = document.getElementById('ad-text').value.trim();
            const link = document.getElementById('ad-link').value.trim();
            const fileInput = document.getElementById('ad-image');
            
            if (!text && fileInput.files.length === 0) {
                showToast(t('msg_upload_req'), "error"); return;
            }

            const rect = getSelectionRect(currentSelection.startX, currentSelection.startY, currentSelection.endX, currentSelection.endY);
            let imageUrl = null;
            let randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');

            if (fileInput.files && fileInput.files[0]) {
                try {
                    imageUrl = await processImageFile(fileInput.files[0], rect.w * BLOCK_PX, rect.h * BLOCK_PX);
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => { cachedImages[imageUrl] = img; resolve(); };
                        img.src = imageUrl;
                    });
                } catch(e) {
                    console.error(e);
                }
            }

            const adData = {
                x: rect.x, y: rect.y, w: rect.w, h: rect.h, 
                text: text, link: link, imageUrl: imageUrl, color: randomColor
            };

            ads.push(adData);
            
            showToast(t('msg_pub_success'), "success");
            closeModal('modal-content'); 
            currentSelection = null; 
            updateSelectionUI(); 
            calculateStats();
            drawCanvas();
        }

        function processImageFile(file, targetWidth, targetHeight) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const oc = document.createElement('canvas');
                        oc.width = targetWidth; oc.height = targetHeight;
                        const octx = oc.getContext('2d');
                        octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
                        octx.drawImage(img, 0, 0, targetWidth, targetHeight);
                        resolve(oc.toDataURL('image/png'));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        window.addEventListener('load', init);
    </script>
